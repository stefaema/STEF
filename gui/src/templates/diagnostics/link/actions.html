{%- import "macros/style.html" as S -%}
{%- import "macros/marks.html" as M -%}
{%- if probe_refusal %}<div class="{{ S.note }}">{{ probe_refusal }}</div>{% endif %}
{%- if action_error %}<div class="{{ S.noteError }}">{{ action_error }}</div>
{%- elif link_failure %}<div class="{{ S.noteError }}">{{ link_failure }}</div>{% endif %}
<div class="flex items-center gap-2">
  {%- if link_is_up %}
  <button type="button" class="{{ S.btn }}"
          hx-post="/diagnostics/{{ subsystem_view.id }}/link/disconnect" hx-target="#main" hx-swap="innerHTML">
    {{ M.icon("link_off") }}<span>{{ _("Disconnect") }}</span>
  </button>
  {%- else %}
  <button type="button" class="{{ S.btnPrimary }}"{{ " disabled" if probe_refusal or not probe_answered }}
          {%- if not probe_refusal and probe_answered %} hx-post="/diagnostics/{{ subsystem_view.id }}/link/connect" hx-include="#linkform"
          hx-target="#main" hx-swap="innerHTML" hx-indicator="this" hx-disabled-elt="this"{% endif %}>
    {{ M.spinner(not probe_answered, "link") }}<span>{{ _("Checking") if not probe_answered else _("Connect") }}</span>
  </button>
  {%- endif %}
</div>
