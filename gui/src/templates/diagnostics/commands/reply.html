{%- import "macros/style.html" as S -%}
{%- import "macros/result.html" as R -%}
<div id="reply">
  {%- if command_reply is defined and command_reply %}
  <hr class="{{ S.divider }}">
  <div class="pt-4">
    <div class="{{ S.label }}">{{ _("Reply") }}</div>
    {%- if command_reply.refusal %}<div class="{{ S.noteError }}">{{ command_reply.refusal }}</div>
    {%- else %}{{ R.result(command_reply.result, True) }}{% endif %}
  </div>
  {%- endif %}
</div>
