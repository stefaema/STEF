{%- import "macros/style.html" as S -%}
<div id="panel" class="flex flex-col gap-4">
  {%- if not command_groups %}
  <div class="{{ S.card }}"><div class="{{ S.cardBody }}"><div class="{{ S.hint }}">{{ _("This subsystem declares no commands") }}</div></div></div>
  {%- else %}
  <div class="{{ S.card }}">
    <div class="{{ S.cardHead }}"><span class="{{ S.sectionTitle }}">{{ _("Commands") }}</span></div>
    {% include "diagnostics/commands/picker.html" %}
  </div>
  {% include "diagnostics/commands/method.html" %}
  {%- endif %}
</div>
