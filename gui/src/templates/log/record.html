<div class="log-record log-row-gui px-4 py-px hover:bg-gray-200/40 dark:hover:bg-gray-800" data-source="{{ log_line.source }}">
  <span class="text-gray-500">{{ log_line.time|clock }}</span>
  <span class="truncate text-gray-600 dark:text-gray-400" title="{{ log_line.source }}">{{ log_line.source }}</span>
  <span class="text-xs font-semibold uppercase tracking-wide truncate {{ LEVEL_TONE.get(log_line.level, "text-gray-500") }}" title="{{ log_line.kind }}">{{ log_line.kind }}</span>
  <span class="clamp-2 whitespace-pre-wrap break-words {{ "text-red-500" if log_line.level == "error" else "text-gray-900 dark:text-white" }}" title="{{ log_line.text }}">{{ log_line.text }}</span>
</div>
